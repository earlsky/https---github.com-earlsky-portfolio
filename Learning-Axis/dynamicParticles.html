<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Particles</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];

        function Particle(x, y) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 5 + 1;
            this.speedX = Math.random() * 2 - 1;
            this.speedY = Math.random() * 2 - 1;
            this.lifetime = 3000; // Lifetime in milliseconds
            this.opacity = 1; // Initial opacity is fully opaque
            this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;

            this.update = function(deltaTime) {
                this.x += this.speedX;
                this.y += this.speedY;
                this.lifetime -= deltaTime;
                
                // Calculate opacity based on remaining lifetime
                this.opacity = Math.max(this.lifetime / 3000, 0); // Gradually reduce opacity from 1 to 0
                
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            };

            this.draw = function() {
                ctx.fillStyle = `hsla(${Math.random() * 360}, 100%, 50%, ${this.opacity})`; // Apply opacity
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            };
        }

        function initParticles(event) {
            for (let i = 0; i < 10; i++) {
                const x = event.clientX;
                const y = event.clientY;
                particles.push(new Particle(x, y));
            }
        }

        let lastTime = 0;
        function animate(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Filter out particles whose lifetime has expired
            particles = particles.filter(particle => particle.lifetime > 0);

            particles.forEach(particle => {
                particle.update(deltaTime);
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        canvas.addEventListener('mousemove', initParticles);
        animate(0);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>

</body>
</html>
